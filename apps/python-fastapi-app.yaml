apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-fastapi-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/akshayraina999/python-fastapi-poc.git'
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    name: in-cluster
    namespace: devops-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
